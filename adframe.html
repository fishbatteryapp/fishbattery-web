<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fishbattery Ad Frame</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #090f18;
        color: #d6e0ef;
        font-family: "Segoe UI", sans-serif;
      }
      .wrap {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      .hint {
        font-size: 12px;
        opacity: .82;
        text-align: center;
        padding: 10px;
      }
      .slot {
        width: 100%;
        height: 100%;
        min-height: 90px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="hint" class="hint" style="display:none">Ad is not configured yet.</div>
      <ins id="slot" class="adsbygoogle slot" style="display:none"></ins>
    </div>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var client = (params.get("client") || "").trim();
        var slot = (params.get("slot") || "").trim();
        var format = (params.get("format") || "auto").trim();
        var full = (params.get("full") || "true").trim();

        var hint = document.getElementById("hint");
        var el = document.getElementById("slot");
        if (!client || !slot) {
          hint.style.display = "";
          return;
        }

        el.style.display = "";
        el.setAttribute("data-ad-client", client);
        el.setAttribute("data-ad-slot", slot);
        el.setAttribute("data-ad-format", format);
        el.setAttribute("data-full-width-responsive", full);

        var s = document.createElement("script");
        s.async = true;
        s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + encodeURIComponent(client);
        s.crossOrigin = "anonymous";
        s.onload = function () {
          try {
            (window.adsbygoogle = window.adsbygoogle || []).push({});
          } catch (e) {}
        };
        document.head.appendChild(s);
      })();
    </script>
  </body>
  </html>
